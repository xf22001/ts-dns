name: Build and Upload Artifacts (Dockerized)

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Select OS for Docker Build Environment'
        required: true
        default: '20.04'
        type: choice
        options:
          - 20.04
          - 22.04
          - 24.04
          - latest

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set environment variables
        run: |
          echo "DEPLOYMENT=${{ github.workspace }}/build" >> $GITHUB_ENV
          echo "DOCKER_DEPLOYMENT=/app/build" >> $GITHUB_ENV
          echo "GOOS=linux" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Build the project (in Docker)
        run: |
          if [ "$GOARCH" == "amd64" ]; then
              DEST="${{ env.DEPLOYMENT }}/linux64"
              DOCKER_DEST="${{ env.DOCKER_DEPLOYMENT }}/linux64"
          elif [ "$GOARCH" == "arm64" ]; then
              DEST="${{ env.DEPLOYMENT }}/linux-arm64"
              DOCKER_DEST="${{ env.DOCKER_DEPLOYMENT }}/linux-arm64"
          fi

          mkdir -p "$DEST"

          # 1. 生成编译脚本（此处使用 'EOF' 禁用宿主机的变量替换，确保脚本原样进入容器）
          cat << 'EOF' > .github/docker_build_internal.sh
          set -e
          apt-get update && apt-get install -y wget curl gnupg
          wget -q https://go.dev/dl/go1.23.6.linux-amd64.tar.gz
          tar -C /usr/local -xzf go1.23.6.linux-amd64.tar.gz
          export PATH=$PATH:/usr/local/go/bin
          
          go version
          echo "Building for $GOOS/$GOARCH to $DEST"
          
          # 执行编译：由于指定了文件名，彻底解决 'cmd' 命名问题
          go build -v -o "$DEST/ts-dns" -trimpath -ldflags "-w -s"
          EOF

          # 2. 运行 Docker：直接执行挂载进去的脚本，完全消除转义困扰
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app/cmd \
            -e GOOS=$GOOS \
            -e GOARCH=$GOARCH \
            -e DEST="$DOCKER_DEST" \
            ubuntu:${{ github.event.inputs.os }} \
            /bin/bash /app/.github/docker_build_internal.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.os }}-${{ matrix.arch }}
          path: ${{ env.DEPLOYMENT }}

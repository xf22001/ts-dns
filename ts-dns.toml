# Telescope DNS Configure File
# https://github.com/wolf-joe/ts-dns

listen = ":52053"  # 监听地址，支持tcp/udp后缀，无后缀则同时监听tcp&udp。推荐使用命令行参数代替
ssl_cert_file = "~/ssl/okpig.eu.org/cert.pem"  # SSL证书文件路径，配置后启用DoH
ssl_key_file = "~/ssl/okpig.eu.org/key.pem"    # SSL密钥文件路径，配置后启用DoH
# DOH endpoint will be available at https://<listen_address>/dns-query

hosts_files = ["/etc/hosts"]  # hosts文件路径，支持多hosts
[hosts] # 自定义域名映射
"example.com" = "8.8.8.8"
"*.example.com" = "8.8.8.8"  # 通配符Hosts

[cache]  # dns缓存配置
size = 4096  # 缓存大小，为非正数时禁用缓存
min_ttl = 300  # 最小ttl，单位为秒
max_ttl = 86400  # 最大ttl，单位为秒

[global]
  # DoH请求的超时时间（秒），必须小于下面的总超时时间
  http_timeout = 3
  # 查询组处理的总超时时间（秒）
  timeout = 5

[groups] # 对域名进行分组
  [groups.resolver]
    rules = ["dns.alidns.com", "doh.pub", "doh.360.cn", "dns.google", "cloudflare-dns.com"]
    dns = ["192.168.31.1"]  # DNS服务器列表，默认使用53端口

  [groups.dirty]
    rules = [
      "*docker.io",
      "*docker.com",
      "*google.com",
      "*google.cn",
      "*googleusercontent.com",
      "*gstatic.cn",
      "*gstatic.com",
      "*ggpht.com",
      "*gvt1.com",
      "*gvt2.com",
      "*gvt3.com",
      "*gcr.io",
      "*withgoogle.com",
    ]
    gfwlist_file = "gfwlist.txt" # 匹配到gfwlist规则时使用该组
    concurrent = true # 并发请求上游DNS
    socks5 = "127.0.0.1:1080"  # 当使用国外53端口dns解析时推荐用socks5代理解析
    doh = ["https://dns.google/dns-query", "https://cloudflare-dns.com/dns-query"]  # dns over https服务器

  [groups.hijack]
    rules = ["itv.cmvideo.cn"]
    hijack = [
      "/cache.ott.ystenlive.itv.cmvideo.cn/pixman.io.ystenlive.dnsany.com/",
      "/cache.ott.bestlive.itv.cmvideo.cn/pixman.io.bestlive.dnsany.com/",
      "/cache.ott.wasulive.itv.cmvideo.cn/pixman.io.wasulive.dnsany.com/",
      "/cache.ott.fifalive.itv.cmvideo.cn/pixman.io.fifalive.dnsany.com/",
      "/cache.ott.hnbblive.itv.cmvideo.cn/pixman.io.hnbblive.dnsany.com/",
    ]
    doh = ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query", "https://doh.360.cn"]  # DNS服务器列表，默认使用53端口

  [groups.clean]
    rules = [
      "*okpig.eu.org",
      "*okdog.eu.org",
      "*mmglobalenergy.com",
    ]
    doh = ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query", "https://doh.360.cn"]  # DNS服务器列表，默认使用53端口
    fallback = true # 设置为兜底域名组

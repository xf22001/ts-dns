# Telescope DNS Configure File
# https://github.com/wolf-joe/ts-dns

# ========== 监听配置 ==========
# 方式一（默认，单端口复用）：无后缀同时监听 tcp&udp；带 /tcp、/udp 后缀则只监听对应协议。
# 此时 DoH(HTTPS) 与 TCP DNS 在该端口上通过 cmux 自动区分。
listen = ":53/udp"  # 推荐使用命令行参数 -listen 代替
# ssl_cert_file = "ssl/cert.pem"  # SSL证书文件路径，配置后启用DoH
# ssl_key_file = "ssl/key.pem"    # SSL密钥文件路径，配置后启用DoH
# DOH endpoint will be available at https://<listen_address>/dns-query

# 明文 HTTP DoH（可选）：供反向代理(如 nginx)终止 TLS 后转发 /dns-query 使用，
# 仅需填端口号，ts-dns 固定绑 127.0.0.1:<端口>，不加载证书；ts-dns 通过
# X-Forwarded-For / X-Forwarded-Proto 还原真实客户端地址与所用协议。
# listen_doh_http = 53053

# ---- 反向代理（nginx）示例 ----
# 将明文 HTTP DoH 绑在 loopback，由 nginx 对外提供 HTTPS 并转发：
#   listen_doh_http = 53053
# nginx 配置（片段）：
#   server {
#       listen 443 ssl;
#       location /dns-query {
#           proxy_set_header Host $host;
#           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#           proxy_set_header X-Forwarded-Proto $scheme;  # 让 ts-dns 记录真实协议(https)
#           proxy_pass http://127.0.0.1:53053;          # 指向上面的 listen_doh_http
#       }
#   }
# 说明：ts-dns 会信任 X-Forwarded-For / X-Forwarded-Proto（仅对明文 HTTP DoH 监听生效），
#       取 XFF 中最右侧（代理直连对端）条目作为真实客户端，以此还原客户端地址与协议，
#       日志记录远程 IP 与 proto=https；左侧条目为客户端可伪造，会被忽略。
disable_qtypes = ["AAAA", "HTTPS"]  # 屏蔽IPv6/HTTPS查询

hosts_files = ["/etc/hosts"]  # hosts文件路径，支持多hosts
[hosts] # 自定义域名映射
"example.com" = "8.8.8.8"
"*.example.com" = "8.8.8.8"  # 通配符Hosts
"cloudflare-dns.com" = "1.0.0.1"  # 防止下文提到的DoH回环解析

[cache]  # dns缓存配置
size = 4096  # 缓存大小，为非正数时禁用缓存
min_ttl = 60  # 最小ttl，单位为秒
max_ttl = 86400  # 最大ttl，单位为秒

[groups] # 对域名进行分组
  [groups.clean]
  rules = ["qq.com", ".baidu.com", "*.taobao.com"]  # "qq.com"规则可匹配"test.qq.com"、"qq.com"两种域名，".qq.com"和"*.qq.com"规则无法匹配"qq.com"
  rules_file = "rules.txt"  # 规则文件，每行一个规则
  fallback = true # 设置为兜底域名组

  ecs = "1.2.4.0/24"  # edns-client-subnet信息，配置后转发DNS请求时默认附带（已有ecs时不覆盖），暂不支持doh
  no_cookie = false  # 禁用edns cookie，默认false，dnspod(119.29.29.29)等特殊服务器需要设置为true
  dns = ["223.5.5.5:53", "114.114.114.114/tcp"]  # DNS服务器列表，默认使用53端口

  fastest_ip = true  # 选择ping值最低的IP地址作为响应，启用且使用icmp ping时建议以root权限允许本程序
  tcp_ping_port = 80  # 当启用fastest_ip时，如该值大于0则使用tcp ping，小于等于0则使用icmp ping
  fastest_ping_timeout_ms = 500  # 单次IP测速超时，单位毫秒
  fastest_ping_max_ips = 15  # 参与测速的最大IP数量

  redirector = "oversea_ip2dirty" # 解析后判断是否需要重定向

  [groups.dirty]
  disable_qtypes = ["AAAA", "HTTPS"]  # 对指定组单独屏蔽IPv6/HTTPS查询

  gfwlist_file = "gfwlist.txt" # 本地gfwlist文件路径（启动时加载，base64编码）
  # gfwlist_url = "https://raw.githubusercontent.com/gfwlist/gfwlist/refs/heads/master/gfwlist.txt" # 远程URL（可选，定期拉取更新本地文件）
  # gfwlist_update = "1h"      # 更新周期，支持 m/h/d（如 30m、1h、2d），默认 1h

  socks5 = "127.0.0.1:1080"  # 当使用国外53端口dns解析时推荐用socks5代理解析
  dns = ["8.8.8.8", "1.1.1.1"]  # 如不想用socks5代理解析时推荐使用国外非53端口dns
  dot = ["1.0.0.1:853@cloudflare-dns.com"]  # dns over tls服务器
  # 警告：如果本机的dns指向ts-dns自身，且DoH地址中的域名被归类到该组，则会出现回环解析的情况，此时需要在上面的hosts中指定对应IP
  doh = ["https://cloudflare-dns.com/dns-query"]  # dns over https服务器

  # 警告：进程启动时会覆盖已有同名IPSet
  ipset = "blocked"  # 目标IPSet名称，该组所有域名的ipv4解析结果将加入到该IPSet中
  ipset6 = "blocked6"  # 目标IPSet名称，该组所有域名的ipv6解析结果将加入到该IPSet中
  ipset_ttl = 86400 # ipset记录超时时间，单位为秒，推荐设置以避免ipset记录过多

  # 可选自定义分组，用于其它情况
  # 比如办公网内，内外域名（company.com）用内网dns（10.1.1.1）解析
  [groups.work]
  dns = ["10.1.1.1"]
  rules = ["company.com"]

[redirectors]
  [redirectors.oversea_ip2dirty]
  # 解析后如发现ip地址不匹配cnip，则重定向到dirty组解析
  type = "mismatch_cidr"
  rules_file = "cnip.txt"
  dst_group = "dirty"
